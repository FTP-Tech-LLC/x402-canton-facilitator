# Canton x402 facilitator on a Splice DevNet validator host (co-resident).
#
# The container is the same on every network. Only .env changes
# (CANTON_NETWORK, CANTON_SCAN_URL, CANTON_SYNCHRONIZER_ID, OIDC_*).
#
# - The image is referenced by tag, not built here. Build it from the repo root
#   with `docker build -f packages/facilitator/Dockerfile -t canton-x402-facilitator:<tag> .`
#   and load it on the host.
# - The facilitator joins the validator's existing docker network and reaches
#   the participant by service name. Change the network name at the bottom if
#   your validator compose project uses another name.
# - Port 4022 is published on 127.0.0.1 only. Put a TLS proxy in front.
# - The whole .env is forwarded (env_file), so every variable in
#   docs/deployment.md reaches the container.
#
# Guide: docs/deployment.md. Template: .env.example next to this file.

services:
  postgres:
    image: postgres:16-alpine
    container_name: canton-x402-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-x402}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-x402}
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data
    networks:
      - x402-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-x402}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  facilitator:
    # A /settle can wait about 57s on the ledger and shutdown drains for up to
    # 55s. Docker's default 10s stop would kill a payment mid-flight.
    stop_grace_period: 70s
    image: ${IMAGE_TAG:-canton-x402-facilitator:latest}
    container_name: canton-x402-facilitator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "4022"
      # Required. Missing values fail at `docker compose up`.
      CANTON_NETWORK: ${CANTON_NETWORK:?missing CANTON_NETWORK}
      CANTON_PARTICIPANT_URL: ${CANTON_PARTICIPANT_URL:?missing CANTON_PARTICIPANT_URL}
      CANTON_FACILITATOR_PARTY: ${CANTON_FACILITATOR_PARTY:?missing CANTON_FACILITATOR_PARTY}
      CANTON_SYNCHRONIZER_ID: ${CANTON_SYNCHRONIZER_ID:?missing CANTON_SYNCHRONIZER_ID}
      CANTON_SCAN_URL: ${CANTON_SCAN_URL:?missing CANTON_SCAN_URL}
      CANTON_SCAN_FLAVOR: ${CANTON_SCAN_FLAVOR:-sv}
      DATABASE_URL: postgres://${POSTGRES_USER:-x402}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-x402}
      # OIDC is the only issuer for a real participant. unsafe-hmac is LocalNet only.
      JWT_ISSUER: ${JWT_ISSUER:-oidc}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:?missing OIDC_TOKEN_ENDPOINT}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?missing OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?missing OIDC_CLIENT_SECRET}
      OIDC_SCOPE: ${OIDC_SCOPE:-daml_ledger_api}
      LEDGER_API_AUDIENCE: ${LEDGER_API_AUDIENCE:?missing LEDGER_API_AUDIENCE}
      CANTON_USER_ID: ${CANTON_USER_ID:?missing CANTON_USER_ID}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      x402-db: {}
      splice-validator:
        aliases: [canton-x402-facilitator]
    ports:
      - "${FACILITATOR_BIND:-127.0.0.1}:4022:4022"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  x402-db:
    driver: bridge
  # The validator's network. Compose attaches to it and never creates or
  # removes it. Find the name with `docker network ls | grep splice`.
  splice-validator:
    external: true
    name: splice-validator_splice_validator
